name: Gerar APK Celebra

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar dependencias
        run: npm ci
      - name: Evitar incluir o APK dentro dele mesmo
        run: rm -f public/downloads/celebra-convite.apk

      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publicar APK no Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put celebra-downloads/celebra-convite.apk             --file=android/app/build/outputs/apk/debug/app-debug.apk             --remote             --content-type=application/vnd.android.package-archive

      - uses: actions/upload-artifact@v4
        with:
          name: Celebra-Convite-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
