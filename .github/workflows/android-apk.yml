name: Gerar APK Celebra

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar dependencias
        run: npm ci
      - name: Evitar incluir o APK dentro dele mesmo
        run: rm -f public/downloads/celebra-convite.apk

      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publicar APK no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk celebra-convite.apk
          if gh release view apk-atual >/dev/null 2>&1; then
            gh release upload apk-atual celebra-convite.apk --clobber
          else
            gh release create apk-atual celebra-convite.apk               --title "Celebra Convite - APK atual"               --notes "Versão atual do aplicativo Celebra para convidados."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Celebra-Convite-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
