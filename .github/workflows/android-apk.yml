name: Gerar APK Celebra

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar dependencias
        run: npm ci
      - name: Evitar incluir o APK dentro dele mesmo
        run: rm -f public/downloads/celebra-convite.apk

      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Atualizar APK público
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/celebra-convite.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/downloads/celebra-convite.apk
          if git diff --cached --quiet; then
            echo "APK público já está atualizado"
          else
            git commit -m "Atualiza APK público automaticamente"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Celebra-Convite-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
